<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SGGo! — Cẩm Nang Du Lịch & Lộ Trình Sài Gòn</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-box">
        <h1>SG<span>Go!</span></h1>
        <span class="badge">Sài Gòn Pilot</span>
      </div>
      <nav class="nav-links">
        <button class="nav-btn active">Khám Phá Nhanh</button>
        <button class="nav-btn">Tất Cả Địa Điểm</button>
        <button class="nav-btn">Lộ Trình AI</button>
      </nav>
    </header>

    <main class="main-content">
      <section class="hero-section">
        <h2>Khám phá 40+ địa điểm di sản & ẩm thực Chợ Lớn</h2>
        <p>Hệ thống hỗ trợ tìm kiếm, lọc theo ngữ cảnh và tối ưu tuyến đường di chuyển thông minh.</p>
      </section>

      <!-- Search & Filters Toolbar -->
      <div class="toolbar">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Tìm kiếm địa điểm, món ăn, địa chỉ..." />
        </div>
        <div class="filter-pills">
          <button class="pill active" onclick="filterByCategory('all')">Tất cả</button>
          <button class="pill" onclick="filterByCategory('an_uong')">Ẩm thực</button>
          <button class="pill" onclick="filterByCategory('di_choi')">Di sản</button>
        </div>
      </div>

      <!-- Map Container -->
      <div class="map-wrapper">
        <div id="map"></div>
      </div>

      <section class="places-grid" id="placesContainer"></section>
    </main>
  </div>

  <!-- Place Detail Modal -->
  <div class="modal-overlay" id="placeDetailModal" style="display: none;">
    <div class="modal-dialog">
      <button class="modal-close" onclick="closePlaceModal()">&times;</button>
      <div class="modal-cover" id="modalCover"></div>
      <div class="modal-content">
        <h3 id="modalName">Tên địa điểm</h3>
        <p class="modal-address" id="modalAddress">Địa chỉ</p>
        <div class="modal-details">
          <div class="detail-item">
            <span class="label">Giờ mở cửa:</span>
            <span class="val" id="modalHours">08:00 - 22:00</span>
          </div>
          <div class="detail-item">
            <span class="label">Mức giá:</span>
            <span class="val" id="modalPrice">30k - 100k</span>
          </div>
          <div class="detail-item">
            <span class="label">Đánh giá:</span>
            <span class="val" id="modalRating">⭐ 4.5</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
